[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "shared-row-parametric"
version = "0.1.0"
description = "Parametric cross-section generation and reallocation for the shared-row specification"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "Apache-2.0" }
keywords = ["shared-row", "right-of-way", "streets", "gis", "transportation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: GIS",
]
# No runtime dependencies: the standard library only, so this also runs
# inside the Python that ships with ArcGIS Pro.
dependencies = []

[project.scripts]
shared-row-parametric = "shared_row_parametric.cli:main"

[project.urls]
Specification = "https://github.com/d-wasserman/shared-row"

[tool.setuptools]
packages = ["shared_row_parametric"]

[tool.setuptools.package-data]
shared_row_parametric = ["templates.json"]
